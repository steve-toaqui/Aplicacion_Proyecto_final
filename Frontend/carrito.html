<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras - Tienda Gamer</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="header">
        <div class="logo">Tienda Gamer</div>
        <nav class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="login.html">Ingresar</a>
            <a href="carrito.html">Carrito</a>
        </nav>
    </header>

    <main class="main-content">
        <section class="form-container" style="max-width: 600px;">
            <h2>Tu Carrito de Compras de tu tienda Gamer</h2>
            
            <div id="lista-carrito" style="margin-bottom: 20px;">
                <p>Cargando carrito...</p>
            </div>

            <div style="border-top: 2px solid #ccc; padding-top: 15px; text-align: right;">
                <h3>Total a Pagar: $<span id="total-carrito">0.00</span></h3>
            </div>

            <button id="btn-comprar" style="margin-top: 20px; background-color: #28a745; width: 100%; padding: 12px; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
                Confirmar Compra
            </button>
        </section>
    </main>

    <script src="js/carrito.js"></script>
</body>
</html>
