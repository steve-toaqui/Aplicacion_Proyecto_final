<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar - Tienda Gamer</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="header">
        <div class="logo">Tienda Gamer</div>
        <nav class="nav-links">
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="login.html">Ingresar</a>
            <a href="carrito.html">Carrito</a>
        </nav>
    </header>

    <main class="main-content">
        <section class="form-container">
            <h2>Iniciar Sesión</h2>
            <form id="form-login">
                <label>Correo Electrónico:</label>
                <input type="email" id="email-login" required>

                <label>Contraseña:</label>
                <input type="password" id="password-login" required>

                <button type="submit">Entrar a la tienda Gamer</button>
                <p style="margin-top: 15px; text-align: center;">No tienes cuenta?<a href="registro.html">Regístrate aquí</a></p>
            </form>
        </section>
    </main>
    <script src="js/auth.js"></script>
</body>
</html>
